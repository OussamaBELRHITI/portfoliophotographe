spring:
  application:
    name: photographer-portfolio-backend

  datasource:
    # Port 5433 — see docker-compose.yml: 5432 is taken by a native PostgreSQL install.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/photographer_portfolio}
    username: ${DB_USERNAME:portfolio}
    password: ${DB_PASSWORD:portfolio}

  jpa:
    hibernate:
      # 'update' lets Hibernate grow the schema as we add fields — fine while the model is
      # still moving. Swap to 'validate' and introduce Flyway migrations before deploying,
      # because 'update' never drops or alters a column and will silently drift from the code.
      ddl-auto: update
    # Off by default in Boot, but worth stating explicitly: leaving the persistence context
    # open for the whole request lets lazy associations load during JSON serialisation, which
    # hides N+1 queries in the view layer. With it false, a LazyInitializationException tells
    # you honestly that the service forgot to fetch something.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          # Lets Hibernate batch inserts/updates — matters when reordering a whole gallery.
          batch_size: 25
        order_inserts: true
        order_updates: true

  jackson:
    # Serialise Instants as ISO-8601 strings ("2026-08-05T14:30:00Z") rather than epoch
    # numbers, so the Next.js side can hand them straight to `new Date(...)`.
    #
    # Boot 4 ships Jackson 3, where this flag moved off SerializationFeature onto
    # DateTimeFeature — hence 'datatype.datetime' rather than the Jackson 2 'serialization'
    # block you'll see in older tutorials.
    datatype:
      datetime:
        write-dates-as-timestamps: false
    default-property-inclusion: non_null

  servlet:
    multipart:
      # Files go browser -> Cloudinary directly, never through this server. Kept small so a
      # stray large upload aimed at the API fails fast instead of buffering.
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

logging:
  level:
    # Uncomment while learning to watch the SQL Hibernate actually emits:
    # org.hibernate.SQL: DEBUG
    # org.hibernate.orm.jdbc.bind: TRACE
    com.portfolio.backend: DEBUG

# Application-specific settings. These are bound to typed @ConfigurationProperties classes
# rather than read with @Value, so a missing value fails at startup instead of at first use.
app:
  # Seeds the photographer's account on first startup only — see AdminUserSeeder.
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:changeme}
    email: ${ADMIN_EMAIL:}

  cors:
    # The Next.js dev server. Add the Vercel domain here at deploy time.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  jwt:
    # Base64-encoded HMAC key. The default below is for local development ONLY — generate a
    # real one for any deployed environment and pass it in as an env var:
    #   openssl rand -base64 32
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uIQ==}
    # 12 hours, in milliseconds.
    expiration-ms: ${JWT_EXPIRATION_MS:43200000}
    issuer: photographer-portfolio

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    # Never reaches the browser. The backend uses it only to sign upload requests and to
    # authenticate deletes.
    api-secret: ${CLOUDINARY_API_SECRET:}
    upload-folder: ${CLOUDINARY_UPLOAD_FOLDER:portfolio}
